name: Decision
about: Architecture, data, model, or process decision
labels: ["type:decision"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What must be decided?
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: Keep this short.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      value: "- [ ] Evidence recorded\n- [ ] Decision recorded"
    validations:
      required: true
  - type: textarea
    id: capability
    attributes:
      label: Capability accounting
      description: Finalize immediately before closure; separate project capability from whether this decision directly changed model weights.
      value: "Model improvement since previous closed Issue: pending\nModel improvement since Issue #1: pending\nGCI-v1: pending\nModel weights changed: pending\nCheckpoint promoted: pending"
    validations:
      required: true
