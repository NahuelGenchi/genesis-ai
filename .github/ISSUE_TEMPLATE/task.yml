name: Task
about: Any code, docs, research, experiment, tooling, or process work
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One sentence.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: One sentence.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Short checklist.
      value: "- [ ]"
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Only if needed.
  - type: textarea
    id: capability
    attributes:
      label: Capability accounting
      description: Keep as pending while open. Replace with measured values immediately before closure; never use 0% for an undefined zero-baseline relative change.
      value: "Model improvement since previous closed Issue: pending\nModel improvement since Issue #1: pending\nGCI-v1: pending\nModel weights changed: pending\nCheckpoint promoted: pending"
    validations:
      required: true
