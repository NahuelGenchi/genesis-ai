name: M6 useful-domain selection — frozen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-record:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen selection record
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('research/m6-domain-selection-v1.json').read_text())
          assert result['suite_version'] == 'm6-domain-selection-v1'
          assert result['tasks_per_domain'] == 60
          assert result['checkpoint_sha256'] == '4db01f8239cfc28933bc3152b7b698ffe089491ce1acf5b66de8adc53b9f8ed9'
          assert result['selected_domain'] == 'code'
          assert all(result['domains'][domain]['exact_accuracy'] == 0.0 for domain in ('math', 'structured', 'code'))
          assert result['domains']['code']['oracle_target_loss'] < result['domains']['structured']['oracle_target_loss']
          assert result['domains']['structured']['oracle_target_loss'] < result['domains']['math']['oracle_target_loss']
          assert result['result_provenance']['workflow_run_id'] == '31810825418'
          print('m6 domain-selection v1 record verified')
          PY
