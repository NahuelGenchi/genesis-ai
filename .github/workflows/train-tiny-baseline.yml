name: Train tiny baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/genesis_ai/model.py
      - src/genesis_ai/config.py
      - src/genesis_ai/data.py
      - src/genesis_ai/checkpoint.py
      - src/genesis_ai/train.py
      - src/genesis_ai/generate.py
      - src/genesis_ai/evaluate.py
      - src/genesis_ai/model_card.py
      - tokenizers/genesis-v0.json
      - data/bootstrap-tokenizer-sources.json
      - data/bootstrap-tokenizer-lock.json
      - .github/workflows/train-tiny-baseline.yml

permissions:
  contents: write

concurrency:
  group: tiny-baseline
  cancel-in-progress: false

jobs:
  train:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare persistent Python environment
        run: |
          ENV_DIR="$HOME/.cache/genesis-ai-ci/venv"
          if [ ! -x "$ENV_DIR/bin/python" ]; then
            python3 -m venv "$ENV_DIR"
          fi
          if ! "$ENV_DIR/bin/python" -c 'import torch' >/dev/null 2>&1; then
            "$ENV_DIR/bin/python" -m pip install --upgrade pip
            "$ENV_DIR/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          fi
      - name: Rebuild approved corpus
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          rm -rf runs/m2
          PYTHONPATH=src "$PY" -m genesis_ai.bootstrap_corpus \
            --catalog data/bootstrap-tokenizer-sources.json \
            --workspace runs/m2/corpus \
            --output runs/m2/rebuilt-tokenizer.json \
            --lock data/bootstrap-tokenizer-lock.json \
            --vocab-size 512
          cmp tokenizers/genesis-v0.json runs/m2/rebuilt-tokenizer.json
      - name: Train first half from random weights
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          PYTHONPATH=src "$PY" -m genesis_ai.train \
            --data runs/m2/corpus/filtered \
            --tokenizer tokenizers/genesis-v0.json \
            --steps 80 \
            --batch-size 8 \
            --lr 0.001 \
            --seed 1337 \
            --device cpu \
            --checkpoint runs/m2/train.pt \
            --checkpoint-every 40 \
            --run-metadata runs/m2/run-80.json \
            --context-length 128 \
            --d-model 96 \
            --n-heads 4 \
            --n-layers 3 \
            --d-ff 384
      - name: Resume exactly to step 160
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          PYTHONPATH=src "$PY" -m genesis_ai.train \
            --data runs/m2/corpus/filtered \
            --tokenizer tokenizers/genesis-v0.json \
            --resume runs/m2/train.pt \
            --steps 160 \
            --batch-size 8 \
            --lr 0.001 \
            --seed 1337 \
            --device cpu \
            --checkpoint runs/m2/train.pt \
            --checkpoint-every 40 \
            --run-metadata runs/m2/run.json \
            --export runs/m2/genesis-tiny-v0.pt
      - name: Require measured learning
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          "$PY" - <<'PY'
          import json
          from pathlib import Path
          metrics = json.loads(Path('runs/m2/run.json').read_text())
          assert metrics['resumed_from_step'] == 80, metrics
          assert metrics['probe_loss_decreased'] is True, metrics
          assert metrics['probe_loss_after'] < metrics['probe_loss_before'], metrics
          PY
      - name: Evaluate validation split
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          PYTHONPATH=src "$PY" -m genesis_ai.evaluate \
            --checkpoint runs/m2/genesis-tiny-v0.pt \
            --data runs/m2/corpus/filtered \
            --split validation \
            --batch-size 8 \
            --batches 20 \
            --device cpu \
            --output runs/m2/eval.json
      - name: Generate seeded sample
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          PYTHONPATH=src "$PY" -m genesis_ai.generate \
            --checkpoint runs/m2/genesis-tiny-v0.pt \
            --prompt "The " \
            --tokens 80 \
            --temperature 0.8 \
            --top-k 40 \
            --seed 1337 \
            --device cpu > runs/m2/sample.txt
      - name: Build model card
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          rm -rf models/genesis-tiny-v0
          PYTHONPATH=src "$PY" -m genesis_ai.model_card \
            --run runs/m2/run.json \
            --evaluation runs/m2/eval.json \
            --checkpoint runs/m2/genesis-tiny-v0.pt \
            --tokenizer tokenizers/genesis-v0.json \
            --source-lock data/bootstrap-tokenizer-lock.json \
            --sample runs/m2/sample.txt \
            --output-dir models/genesis-tiny-v0
      - name: Validate repository
        run: PYTHON_BIN="$HOME/.cache/genesis-ai-ci/venv/bin/python" ./scripts/test_local.sh
      - name: Commit baseline record
        run: |
          cp runs/m2/genesis-tiny-v0.pt checkpoints/genesis-tiny-v0.pt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f checkpoints/genesis-tiny-v0.pt
          git add models/genesis-tiny-v0/MODEL_CARD.md models/genesis-tiny-v0/metrics.json
          if ! git diff --cached --quiet; then
            git commit -m "M2: train genesis-tiny-v0 (#20)" -m "Refs #20 #23"
            git push origin HEAD:main
          fi
