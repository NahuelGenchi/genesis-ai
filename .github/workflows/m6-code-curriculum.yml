name: M6 code curriculum lock

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - experiments/m6-code-curriculum-v1.json
      - src/genesis_ai/curriculum.py
      - tests/test_curriculum.py
      - .github/workflows/m6-code-curriculum.yml

permissions:
  contents: write

concurrency:
  group: m6-code-curriculum-v1
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    env:
      WORK: runs/m6-code-curriculum-v1
      RESULT: research/m6-code-curriculum-v1.json
    steps:
      - uses: actions/checkout@v4

      - name: Prepare persistent Python environment
        run: |
          ENV_DIR="$HOME/.cache/genesis-ai-ci/venv"
          if [ ! -x "$ENV_DIR/bin/python" ]; then python3 -m venv "$ENV_DIR"; fi
          if ! "$ENV_DIR/bin/python" -c 'import torch' >/dev/null 2>&1; then
            "$ENV_DIR/bin/python" -m pip install --upgrade pip
            "$ENV_DIR/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          fi

      - name: Rebuild approved public-domain corpus
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cp data/bootstrap-tokenizer-lock.json "$WORK/bootstrap-tokenizer-lock.json"
          PYTHONPATH=src "$PY" -m genesis_ai.bootstrap_corpus \
            --catalog data/bootstrap-tokenizer-sources.json \
            --workspace "$WORK/public-corpus" \
            --output "$WORK/rebuilt-tokenizer.json" \
            --lock "$WORK/bootstrap-tokenizer-lock.json" \
            --vocab-size 512
          cmp data/bootstrap-tokenizer-lock.json "$WORK/bootstrap-tokenizer-lock.json"
          cmp tokenizers/genesis-v0.json "$WORK/rebuilt-tokenizer.json"

      - name: Build deterministic curriculum lock
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          PYTHONPATH=src "$PY" -m genesis_ai.curriculum \
            --spec experiments/m6-code-curriculum-v1.json \
            --selection research/m6-domain-selection-v1.json \
            --evaluation-suite evals/m6-domain-selection-v1.json \
            --tokenizer tokenizers/genesis-v0.json \
            --public-data "$WORK/public-corpus/filtered" \
            --public-source-lock data/bootstrap-tokenizer-lock.json \
            --public-source-catalog data/bootstrap-tokenizer-sources.json \
            --records "$WORK/procedural.jsonl" \
            --output "$RESULT"
          PYTHONPATH=src "$PY" -m genesis_ai.result_provenance \
            "$RESULT" \
            --source-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID"

      - name: Validate curriculum contract
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          "$PY" - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('research/m6-code-curriculum-v1.json').read_text())
          assert result['curriculum_version'] == 'm6-code-curriculum-v1', result
          assert result['selected_domain'] == 'code', result
          assert result['selection']['baseline_exact_accuracy'] == 0.0, result
          assert result['training']['procedural']['examples'] == 4096, result
          assert result['training']['procedural_batch_fraction'] == 0.8, result
          assert result['training']['public_text_batch_fraction'] == 0.2, result
          assert result['training']['target_training_tokens'] == 2_000_000, result
          assert result['evaluation_separation']['exact_prompt_overlap_count'] == 0, result
          assert result['cash_compute_cost_usd'] == 0.0, result
          assert Path('runs/m6-code-curriculum-v1/procedural.jsonl').is_file()
          PY

      - name: Validate repository
        run: PYTHON_BIN="$HOME/.cache/genesis-ai-ci/venv/bin/python" ./scripts/test_local.sh

      - name: Commit compact curriculum lock safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT"
          if ! git diff --cached --quiet; then
            git commit -m "M6: record deterministic code curriculum (#96)"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
