name: M6 code curriculum record verifier

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen v1 record
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('research/m6-code-curriculum-v1.json').read_text())
          procedural = result['training']['procedural']
          assert result['curriculum_version'] == 'm6-code-curriculum-v1', result
          assert result['selected_domain'] == 'code', result
          assert result['spec_sha256'] == 'c45572beca5ebce16e60019db7ccaeb2d1f9c5422bfea51a2fba8429d3d856f5', result
          assert result['tokenizer_sha256'] == '6f66eba7d552fd22e4c35ba23c1998bbc549ab26ad89a1e0d245524bc802d398', result
          assert result['selection']['suite_sha256'] == '3ff62c0241003198c786afb29c4d64394566ce82dba7eef7681fc9ebe25655d9', result
          assert result['selection']['baseline_exact_accuracy'] == 0.0, result
          assert result['evaluation_separation']['evaluation_task_set_sha256'] == 'edea452777c7328fd13d550ced322bd5815eac664be5f3924047f15122cc17c8', result
          assert result['evaluation_separation']['exact_prompt_overlap_count'] == 0, result
          assert procedural['examples'] == 4096, result
          assert procedural['generation_attempts'] == 5195, result
          assert procedural['prefix_truncated_examples'] == 4096, result
          assert procedural['max_prompt_response_tokens'] == 153, result
          assert procedural['max_training_window_tokens'] == 129, result
          assert procedural['record_set_sha256'] == '6c0d72aa4cf4be930f6ebc0dd508589bb90a36cd48985c04484c38005e76217f', result
          assert procedural['records_file_sha256'] == '6650d775b0285e4027dd2d7e7a546f6569d35ccc40b60067dacf7a7832a28770', result
          assert procedural['truncation_policy'] == 'left_prefix_only_preserve_all_response_tokens', result
          assert result['public_text']['document_count'] == 1082, result
          assert result['public_text']['token_count'] == 274653, result
          assert result['public_text']['content_set_sha256'] == 'cd7942198e38f40cb00f8a2191b4cc47afc4518aa16097c5623fbdac0b82b1c5', result
          assert result['training']['procedural_batch_fraction'] == 0.8, result
          assert result['training']['public_text_batch_fraction'] == 0.2, result
          assert result['training']['target_training_tokens'] == 2_000_000, result
          assert result['cash_compute_cost_usd'] == 0.0, result
          assert result['result_provenance'] == {
              'source_commit': 'bfe89dc004c50d21c40c244392f49d4dad16779d',
              'workflow_run_id': '31834675482',
          }, result
          PY
