name: M6 multi-domain full-capacity v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/genesis_ai/multidomain_curriculum_v2.py
      - src/genesis_ai/multidomain_training_v2.py
      - src/genesis_ai/multidomain_gate_v2.py
      - tests/test_multidomain_v2.py
      - .github/workflows/m6-multidomain-v2.yml

permissions:
  contents: write

concurrency:
  group: m6-multidomain-v2
  cancel-in-progress: false

jobs:
  train:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    env:
      WORK: runs/m6-multidomain-micro-2m-v2
      RESULT_DIR: research/m6-multidomain-micro-2m-v2
      PARENT: checkpoints/genesis-micro-2m-v1.pt
      CANDIDATE: runs/m6-multidomain-micro-2m-v2/candidate-a.pt
      PUBLISHED: checkpoints/genesis-micro-2m-v2.pt
      MODEL_DIR: models/genesis-micro-2m-v2
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Prepare persistent Python environment
        run: |
          ENV_DIR="$HOME/.cache/genesis-ai-ci/venv"
          if [ ! -x "$ENV_DIR/bin/python" ]; then python3 -m venv "$ENV_DIR"; fi
          if ! "$ENV_DIR/bin/python" -c 'import torch' >/dev/null 2>&1; then
            "$ENV_DIR/bin/python" -m pip install --upgrade pip
            "$ENV_DIR/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          fi

      - name: Require promoted parent and rebuild public corpus
        run: |
          test -f "$PARENT"
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          rm -rf "$WORK" "$RESULT_DIR"
          mkdir -p "$WORK" "$RESULT_DIR"
          cp data/bootstrap-tokenizer-lock.json "$WORK/bootstrap-tokenizer-lock.json"
          PYTHONPATH=src "$PY" -m genesis_ai.bootstrap_corpus \
            --catalog data/bootstrap-tokenizer-sources.json \
            --workspace "$WORK/public-corpus" \
            --output "$WORK/rebuilt-tokenizer.json" \
            --lock "$WORK/bootstrap-tokenizer-lock.json" \
            --vocab-size 512
          cmp data/bootstrap-tokenizer-lock.json "$WORK/bootstrap-tokenizer-lock.json"
          cmp tokenizers/genesis-v0.json "$WORK/rebuilt-tokenizer.json"

      - name: Build frozen 4096-per-domain curriculum
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          PYTHONPATH=src "$PY" -m genesis_ai.multidomain_curriculum_v2 \
            --suite evals/m6-domain-selection-v2.json \
            --tokenizer tokenizers/genesis-v0.json \
            --public-data "$WORK/public-corpus/filtered" \
            --records "$WORK/procedural.jsonl" \
            --output "$WORK/curriculum.json"
          cp "$WORK/curriculum.json" "$RESULT_DIR/curriculum.json"

      - name: Train primary 6M continuation candidate
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          PYTHONPATH=src "$PY" -m genesis_ai.multidomain_training_v2 \
            --parent "$PARENT" \
            --curriculum-lock "$WORK/curriculum.json" \
            --records "$WORK/procedural.jsonl" \
            --public-data "$WORK/public-corpus/filtered" \
            --tokenizer tokenizers/genesis-v0.json \
            --checkpoint "$WORK/candidate-a-training.pt" \
            --export "$CANDIDATE" \
            --run "$WORK/training.json" \
            --device cpu

      - name: Train independent 6M replica
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          PYTHONPATH=src "$PY" -m genesis_ai.multidomain_training_v2 \
            --parent "$PARENT" \
            --curriculum-lock "$WORK/curriculum.json" \
            --records "$WORK/procedural.jsonl" \
            --public-data "$WORK/public-corpus/filtered" \
            --tokenizer tokenizers/genesis-v0.json \
            --checkpoint "$WORK/candidate-b-training.pt" \
            --export "$WORK/candidate-b.pt" \
            --run "$WORK/training-replica.json" \
            --device cpu

      - name: Verify semantic reproduction
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          PYTHONPATH=src "$PY" -m genesis_ai.scale_repro \
            --primary "$CANDIDATE" \
            --replica "$WORK/candidate-b.pt" \
            --output "$WORK/reproduction.json"

      - name: Evaluate incumbent and candidate on identical frozen suite
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          PYTHONPATH=src "$PY" -m genesis_ai.terminated_eval \
            --checkpoint "$PARENT" \
            --suite evals/m6-domain-selection-v2.json \
            --output "$WORK/baseline-domain.json" \
            --device cpu
          PYTHONPATH=src "$PY" -m genesis_ai.terminated_eval \
            --checkpoint "$CANDIDATE" \
            --suite evals/m6-domain-selection-v2.json \
            --output "$WORK/candidate-domain.json" \
            --device cpu
          PYTHONPATH=src "$PY" -m genesis_ai.capability_index \
            --baseline "$WORK/baseline-domain.json" \
            --candidate "$WORK/candidate-domain.json" \
            --output "$WORK/gci.json"

      - name: Evaluate M3 general-language regression
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          PYTHONPATH=src "$PY" -m genesis_ai.eval_lab \
            --checkpoint "$PARENT" \
            --data "$WORK/public-corpus/filtered" \
            --suite evals/m3-v1.json \
            --output "$WORK/baseline-m3.json" \
            --device cpu
          PYTHONPATH=src "$PY" -m genesis_ai.eval_lab \
            --checkpoint "$CANDIDATE" \
            --data "$WORK/public-corpus/filtered" \
            --suite evals/m3-v1.json \
            --output "$WORK/candidate-m3.json" \
            --device cpu

      - name: Stage immutable measurements
        run: |
          cp "$WORK/training.json" "$RESULT_DIR/training.json"
          cp "$WORK/reproduction.json" "$RESULT_DIR/reproduction.json"
          cp "$WORK/baseline-domain.json" "$RESULT_DIR/baseline-domain.json"
          cp "$WORK/candidate-domain.json" "$RESULT_DIR/candidate-domain.json"
          cp "$WORK/gci.json" "$RESULT_DIR/gci.json"
          cp "$WORK/baseline-m3.json" "$RESULT_DIR/baseline-m3.json"
          cp "$WORK/candidate-m3.json" "$RESULT_DIR/candidate-m3.json"

      - name: Apply frozen >=100% GCI v2 promotion gate
        id: gate
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          set +e
          PYTHONPATH=src "$PY" -m genesis_ai.multidomain_gate_v2 \
            --baseline-checkpoint "$PARENT" \
            --candidate "$CANDIDATE" \
            --training "$RESULT_DIR/training.json" \
            --reproduction "$RESULT_DIR/reproduction.json" \
            --curriculum "$RESULT_DIR/curriculum.json" \
            --baseline-domain "$RESULT_DIR/baseline-domain.json" \
            --candidate-domain "$RESULT_DIR/candidate-domain.json" \
            --baseline-m3 "$RESULT_DIR/baseline-m3.json" \
            --candidate-m3 "$RESULT_DIR/candidate-m3.json" \
            --output "$RESULT_DIR/gate.json"
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 2 ]; then exit "$STATUS"; fi
          PYTHONPATH=src "$PY" -m genesis_ai.result_provenance \
            "$RESULT_DIR/gate.json" \
            --source-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID"
          PROMOTED=$("$PY" - <<'PY'
          import json
          from pathlib import Path
          print(str(json.loads(Path('research/m6-multidomain-micro-2m-v2/gate.json').read_text())['promoted']).lower())
          PY
          )
          echo "promoted=$PROMOTED" >> "$GITHUB_OUTPUT"

      - name: Publish only a passing v2 checkpoint
        if: steps.gate.outputs.promoted == 'true'
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          cp "$CANDIDATE" "$PUBLISHED"
          PYTHONPATH=src "$PY" -m genesis_ai.multidomain_model_card \
            --checkpoint "$PUBLISHED" \
            --training "$RESULT_DIR/training.json" \
            --gate "$RESULT_DIR/gate.json" \
            --output-dir "$MODEL_DIR"

      - name: Validate repository
        run: PYTHON_BIN="$HOME/.cache/genesis-ai-ci/venv/bin/python" ./scripts/test_local.sh

      - name: Commit measurements and passing checkpoint safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT_DIR"
          if [ "${{ steps.gate.outputs.promoted }}" = "true" ]; then
            git add -f "$PUBLISHED"
            git add "$MODEL_DIR"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "M6: record multi-domain full-capacity v2 (#144)"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
