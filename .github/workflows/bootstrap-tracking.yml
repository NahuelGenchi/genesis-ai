name: Bootstrap tracking

on:
  push:
    branches: [main]
    paths:
      - "tracking/**"
      - "scripts/bootstrap_github_tracking.py"
      - "scripts/render_current_research_state.py"
      - "research/autonomous/state.json"
      - "research/m6-incumbent-structured-diagnostic/latest.json"
      - "research/weak-domain-funnel-v1/**"
      - ".github/workflows/bootstrap-tracking.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: bootstrap-tracking
  cancel-in-progress: true

jobs:
  bootstrap:
    if: github.event.repository.private == false
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Create or reconcile labels, milestones, and durable Issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/bootstrap_github_tracking.py
