name: M6 position-alignment diagnostic record verifier

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen diagnostic
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('research/m6-position-alignment-v1.json').read_text())
          assert result['diagnostic_version'] == 'm6-position-alignment-v1', result
          assert result['checkpoint_step'] == 1955, result
          assert result['suite_version'] == 'm6-domain-selection-v1', result
          assert result['suite_sha256'] == '3ff62c0241003198c786afb29c4d64394566ce82dba7eef7681fc9ebe25655d9', result
          assert result['domain'] == 'code', result
          assert result['task_count'] == 60, result
          assert result['task_set_sha256'] == 'edea452777c7328fd13d550ced322bd5815eac664be5f3924047f15122cc17c8', result
          assert result['legacy_static'] == {
              'mean_loss': 0.0006654456918421551,
              'target_tokens': 891,
          }, result
          assert result['generation_aligned_rolling'] == {
              'all_greedy_tokens_correct_rate': 0.0,
              'all_greedy_tokens_correct_tasks': 0,
              'first_token_greedy_correct_rate': 0.55,
              'first_token_greedy_correct_tasks': 33,
              'greedy_correct_tokens': 409,
              'greedy_token_accuracy': 0.4590347923681257,
              'mean_loss': 3.9263686956076698,
              'target_tokens': 891,
          }, result
          assert result['position_alignment'] == {
              'mean_first_predictor_position_shift': 13.85,
              'shifted_task_rate': 1.0,
              'shifted_tasks': 60,
          }, result
          assert result['result_provenance'] == {
              'source_commit': '9a7ebda17070db0e933bf9c419800544eb93cbcf',
              'workflow_run_id': '31838537349',
          }, result
          assert len(result['samples']) == 8, result
          assert result['samples'][0]['static_first_predictor_position'] == 114, result
          assert result['samples'][0]['generation_first_predictor_position'] == 127, result
          assert result['samples'][0]['first_predictor_position_shift'] == 13, result
          PY
