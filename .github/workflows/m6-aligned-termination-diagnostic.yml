name: M6 aligned termination diagnostic v1 record verifier

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen termination evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('research/m6-aligned-termination-diagnostic-v1.json')
          result = json.loads(path.read_text())

          assert result['diagnostic_version'] == 'm6-termination-diagnostic-v1', result
          assert result['checkpoint_step'] == 1955, result
          assert result['suite_version'] == 'm6-domain-selection-v1', result
          assert result['suite_sha256'] == '3ff62c0241003198c786afb29c4d64394566ce82dba7eef7681fc9ebe25655d9', result
          assert result['domain'] == 'code', result
          assert result['task_count'] == 60, result
          assert result['task_set_sha256'] == 'edea452777c7328fd13d550ced322bd5815eac664be5f3924047f15122cc17c8', result
          assert result['generation'] == {
              'max_new_tokens': 32,
              'seed': 36101,
              'temperature': 1.0,
              'top_k': 1,
          }, result
          assert result['strict_exact'] == {'count': 0, 'rate': 0.0}, result
          assert result['oracle_token_prefix'] == {'count': 60, 'rate': 1.0}, result
          assert result['oracle_text_prefix'] == {'count': 60, 'rate': 1.0}, result
          assert result['oracle_prefix_then_extra'] == {'count': 60, 'rate': 1.0}, result
          assert result['newline_immediately_after_oracle'] == {'count': 0, 'rate': 0.0}, result
          assert result['response_set_sha256'] == 'e5be0676a071e85298338e636ad516188efce058fec11106c3052b71336ec624', result
          assert result['result_provenance'] == {
              'source_commit': 'f15f75cbbeff4261ef9c1fb392844bf52b663bc7',
              'workflow_run_id': '31840711748',
          }, result
          assert len(result['samples']) == 8, result
          assert all(sample['oracle_token_prefix'] for sample in result['samples']), result
          assert all(sample['oracle_text_prefix'] for sample in result['samples']), result
          assert all(not sample['strict_pass'] for sample in result['samples']), result
          PY
