name: M6 termination diagnostic record verifier

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen diagnostic
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('research/m6-termination-diagnostic-v1.json').read_text())
          assert result['diagnostic_version'] == 'm6-termination-diagnostic-v1', result
          assert result['checkpoint_step'] == 1955, result
          assert result['suite_version'] == 'm6-domain-selection-v1', result
          assert result['suite_sha256'] == '3ff62c0241003198c786afb29c4d64394566ce82dba7eef7681fc9ebe25655d9', result
          assert result['domain'] == 'code', result
          assert result['task_count'] == 60, result
          assert result['task_set_sha256'] == 'edea452777c7328fd13d550ced322bd5815eac664be5f3924047f15122cc17c8', result
          assert result['strict_exact'] == {'count': 0, 'rate': 0.0}, result
          assert result['oracle_token_prefix'] == {'count': 0, 'rate': 0.0}, result
          assert result['oracle_text_prefix'] == {'count': 0, 'rate': 0.0}, result
          assert result['oracle_prefix_then_extra'] == {'count': 0, 'rate': 0.0}, result
          assert result['newline_immediately_after_oracle'] == {'count': 0, 'rate': 0.0}, result
          assert result['response_set_sha256'] == '245864e29c18a803def70b3f487c412b06cdaf626745fa652628ce909793a2e5', result
          assert result['result_provenance'] == {
              'source_commit': '9f9b2bd756cd6383ec9d57cf4ad512156f1456d2',
              'workflow_run_id': '31837683797',
          }, result
          assert len(result['samples']) == 8, result
          assert result['samples'][0]['oracle'] == '5*x + 1*y + -8', result
          assert result['samples'][0]['generated'] == '5555*x1*1*y 8*x8*x 8*x55555555y1', result
          assert result['samples'][0]['strict_reason'] == 'invalid_syntax', result
          assert result['samples'][0]['oracle_token_prefix'] is False, result
          assert not Path('checkpoints/genesis-micro-2m-v1.pt').exists()
          PY
