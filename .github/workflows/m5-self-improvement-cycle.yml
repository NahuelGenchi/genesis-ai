name: M5 first self-improvement cycle — frozen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-record:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen v1 record
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('research/m5-cycle-v1.json')
          record = json.loads(path.read_text(encoding='utf-8'))
          recorded_hash = record.pop('record_sha256')
          canonical = json.dumps(record, ensure_ascii=False, separators=(',', ':'), sort_keys=True)
          actual_hash = hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          assert actual_hash == recorded_hash, (actual_hash, recorded_hash)
          assert record['cycle_version'] == 'm5-v1'
          assert record['status'] == 'no_candidate'
          assert record['candidate_trained'] is False
          assert record['promotion_attempted'] is False
          assert record['experience']['attempted'] == 60
          assert record['experience']['accepted'] == 0
          assert record['experience']['rejected'] == 60
          assert record['challenge']['min_accepted'] == 8
          print('m5-v1 frozen record verified')
          PY
