name: M6 micro-2m v1 record verifier

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen rejected experiment
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('research/m6-micro-2m-v1')
          training = json.loads((root / 'training.json').read_text())
          repro = json.loads((root / 'reproduction.json').read_text())
          domain = json.loads((root / 'candidate-domain.json').read_text())
          baseline_m3 = json.loads((root / 'baseline-m3.json').read_text())
          candidate_m3 = json.loads((root / 'candidate-m3.json').read_text())
          gate = json.loads((root / 'gate.json').read_text())

          candidate_sha = 'f5664ce04080b656dc0b826775afe5ff8511db37a37bd0c97ca89c31d5b99469'

          assert training['training_policy'] == 'm6-micro-2m-training-v2', training
          assert training['inference_checkpoint_sha256'] == candidate_sha, training
          assert training['parameter_count'] == 1_895_808, training
          assert training['steps'] == 1_955, training
          assert training['processed_tokens'] == 2_001_920, training
          assert training['target_training_tokens'] == 2_000_000, training
          assert training['procedural_step_fraction'] == 0.8, training
          assert training['public_step_fraction'] == 0.2, training
          assert training['cash_compute_cost_usd'] == 0.0, training
          assert training['determinism'] == {
              'adamw_foreach': False,
              'adamw_fused': False,
              'deterministic_algorithms': True,
              'device': 'cpu',
              'torch_threads': 1,
          }, training
          assert training['procedural_probe_loss_before'] == 6.266472980380058, training
          assert training['procedural_probe_loss_after'] == 0.0006633718530792976, training
          assert training['public_probe_loss_before'] == 6.304238140583038, training
          assert training['public_probe_loss_after'] == 3.459103137254715, training

          assert repro['primary_checkpoint_sha256'] == candidate_sha, repro
          assert repro['weights_equal'] is True, repro
          assert repro['config_equal'] is True, repro
          assert repro['tokenizer_equal'] is True, repro
          assert repro['step_equal'] is True, repro
          assert repro['metadata_equal'] is True, repro
          assert repro['reproducible'] is True, repro

          code = domain['domains']['code']
          assert domain['suite_version'] == 'm6-domain-selection-v1', domain
          assert domain['suite_sha256'] == '3ff62c0241003198c786afb29c4d64394566ce82dba7eef7681fc9ebe25655d9', domain
          assert domain['checkpoint_sha256'] == candidate_sha, domain
          assert code['task_count'] == 60, code
          assert code['exact_correct'] == 0, code
          assert code['exact_accuracy'] == 0.0, code
          assert code['oracle_target_loss'] == 0.0006654456918421551, code
          assert code['task_set_sha256'] == 'edea452777c7328fd13d550ced322bd5815eac664be5f3924047f15122cc17c8', code

          assert baseline_m3['primary_metric']['value'] == 3.686832940578461, baseline_m3
          assert candidate_m3['primary_metric']['value'] == 3.2608576655387878, candidate_m3
          assert candidate_m3['checkpoint_sha256'] == candidate_sha, candidate_m3
          assert candidate_m3['contamination']['blocking'] is False, candidate_m3
          assert candidate_m3['contamination']['exact_overlap_count'] == 0, candidate_m3

          assert gate['candidate_checkpoint_sha256'] == candidate_sha, gate
          assert gate['decision'] == 'reject', gate
          assert gate['promoted'] is False, gate
          assert gate['decision_sha256'] == '39beb54b0274f21336460a30757118245de6264cdf264514c2947b05dbefc097', gate
          assert gate['primary_capability'] == {
              'absolute_gain': 0.0,
              'baseline': 0.0,
              'candidate': 0.0,
              'metric': 'code_exact_accuracy',
          }, gate
          assert gate['result_provenance'] == {
              'source_commit': '701083e799efe454b9a7d2f61ea7450d740fc3f7',
              'workflow_run_id': '31836252107',
          }, gate
          failed = [item['name'] for item in gate['gates'] if not item['passed']]
          assert failed == ['code_exact_accuracy'], gate
          m3_gate = next(item for item in gate['gates'] if item['name'] == 'm3_validation_loss')
          assert m3_gate['observed']['regression_fraction'] == -0.11553961947970387, m3_gate

          assert not Path('checkpoints/genesis-micro-2m-v1.pt').exists()
          assert not Path('models/genesis-micro-2m-v1/MODEL_CARD.md').exists()
          assert not Path('models/genesis-micro-2m-v1/metrics.json').exists()
          PY
