name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # Private mode keeps the trusted zero-cost runner. Once the repository is
    # public, all PR/push CI moves to an ephemeral GitHub-hosted runner so
    # untrusted fork code can never execute on the private machine.
    runs-on: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Python environment
        run: |
          ENV_DIR="$HOME/.cache/genesis-ai-ci/venv"
          if [ ! -x "$ENV_DIR/bin/python" ]; then
            python3 -m venv "$ENV_DIR"
          fi
          if ! "$ENV_DIR/bin/python" -c 'import torch' >/dev/null 2>&1; then
            "$ENV_DIR/bin/python" -m pip install --upgrade pip
            "$ENV_DIR/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          fi
      - name: Validate tracking and tests
        run: PYTHON_BIN="$HOME/.cache/genesis-ai-ci/venv/bin/python" ./scripts/test_local.sh
