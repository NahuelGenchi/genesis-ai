name: Evaluate baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - checkpoints/genesis-tiny-v0.pt
      - evals/m3-v1.json
      - src/genesis_ai/eval_lab.py
      - src/genesis_ai/benchmark.py
      - src/genesis_ai/evaluate.py
      - src/genesis_ai/generate.py
      - .github/workflows/evaluate-baseline.yml

permissions:
  contents: write

concurrency:
  group: baseline-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare persistent Python environment
        run: |
          ENV_DIR="$HOME/.cache/genesis-ai-ci/venv"
          if [ ! -x "$ENV_DIR/bin/python" ]; then
            python3 -m venv "$ENV_DIR"
          fi
          if ! "$ENV_DIR/bin/python" -c 'import torch' >/dev/null 2>&1; then
            "$ENV_DIR/bin/python" -m pip install --upgrade pip
            "$ENV_DIR/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          fi
      - name: Rebuild approved evaluation corpus
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          rm -rf runs/m3
          PYTHONPATH=src "$PY" -m genesis_ai.bootstrap_corpus \
            --catalog data/bootstrap-tokenizer-sources.json \
            --workspace runs/m3/corpus \
            --output runs/m3/rebuilt-tokenizer.json \
            --lock data/bootstrap-tokenizer-lock.json \
            --vocab-size 512
          cmp tokenizers/genesis-v0.json runs/m3/rebuilt-tokenizer.json
      - name: Run versioned evaluation
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          PYTHONPATH=src "$PY" -m genesis_ai.eval_lab \
            --checkpoint checkpoints/genesis-tiny-v0.pt \
            --data runs/m3/corpus/filtered \
            --suite evals/m3-v1.json \
            --device cpu \
            --output models/genesis-tiny-v0/evaluation-m3-v1.json
      - name: Benchmark compute and inference
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          PYTHONPATH=src "$PY" -m genesis_ai.benchmark \
            --checkpoint checkpoints/genesis-tiny-v0.pt \
            --device cpu \
            --hourly-cost 0 \
            --batch-size 8 \
            --training-steps 50 \
            --decode-tokens 128 \
            --output models/genesis-tiny-v0/benchmark-m3-v1.json
      - name: Validate repository
        run: PYTHON_BIN="$HOME/.cache/genesis-ai-ci/venv/bin/python" ./scripts/test_local.sh
      - name: Commit evaluation records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/genesis-tiny-v0/evaluation-m3-v1.json models/genesis-tiny-v0/benchmark-m3-v1.json
          if ! git diff --cached --quiet; then
            git commit -m "M3: record baseline evaluation (#24)" -m "Refs #24 #25 #26"
            git push origin HEAD:main
          fi
