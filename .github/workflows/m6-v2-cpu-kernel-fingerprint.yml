name: M6 v2 MKLDNN-off MKL fingerprint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/m6-v2-cpu-kernel-fingerprint.yml

permissions:
  contents: write

concurrency:
  group: m6-v2-cpu-kernel-fingerprint
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - mkl_cbwr_mode: auto
            mkl_cbwr: ""
          - mkl_cbwr_mode: compatible
            mkl_cbwr: COMPATIBLE
          - mkl_cbwr_mode: avx2
            mkl_cbwr: AVX2
          - mkl_cbwr_mode: sse4_2
            mkl_cbwr: SSE4_2
    env:
      WORK: runs/m6-v2-cpu-kernel-fingerprint
      TARGET_PROBE: "4.228255425977561"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      MKL_CBWR: ${{ matrix.mkl_cbwr }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned CPU PyTorch
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.11.0"
          python - <<'PY'
          import os, platform, torch
          print({
              "python": platform.python_version(),
              "torch": torch.__version__,
              "cuda": torch.version.cuda,
              "mkldnn_available": torch.backends.mkldnn.is_available(),
              "mkl_available": torch.backends.mkl.is_available(),
              "mkl_cbwr": os.environ.get("MKL_CBWR", ""),
          })
          PY

      - name: Rebuild frozen public inputs and curriculum
        run: |
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cp data/bootstrap-tokenizer-lock.json "$WORK/bootstrap-tokenizer-lock.json"
          PYTHONPATH=src python -m genesis_ai.bootstrap_corpus \
            --catalog data/bootstrap-tokenizer-sources.json \
            --workspace "$WORK/public-corpus" \
            --output "$WORK/rebuilt-tokenizer.json" \
            --lock "$WORK/bootstrap-tokenizer-lock.json" \
            --vocab-size 512
          cmp tokenizers/genesis-v0.json "$WORK/rebuilt-tokenizer.json"
          PYTHONPATH=src python -m genesis_ai.multidomain_curriculum_v2 \
            --suite evals/m6-domain-selection-v2.json \
            --tokenizer tokenizers/genesis-v0.json \
            --public-data "$WORK/public-corpus/filtered" \
            --records "$WORK/procedural.jsonl" \
            --output "$WORK/curriculum.json"

      - name: Measure exact pre-training fingerprint
        run: |
          PYTHONPATH=src python - <<'PY'
          import json, os, platform, random
          from pathlib import Path
          import torch
          from genesis_ai.multidomain_training_v2 import SEED, _loss_probe, validate_inputs
          from genesis_ai.terminated_training import TerminatedGenerationAlignedDataset

          torch.backends.mkldnn.enabled = False
          torch.set_num_threads(1)
          torch.use_deterministic_algorithms(True)
          random.seed(SEED)
          torch.manual_seed(SEED)
          model, tokenizer, records, _, _, _ = validate_inputs(
              parent_checkpoint='checkpoints/genesis-micro-2m-v1.pt',
              curriculum_lock='runs/m6-v2-cpu-kernel-fingerprint/curriculum.json',
              records_path='runs/m6-v2-cpu-kernel-fingerprint/procedural.jsonl',
              public_data='runs/m6-v2-cpu-kernel-fingerprint/public-corpus/filtered',
              tokenizer_path='tokenizers/genesis-v0.json',
          )
          dataset = TerminatedGenerationAlignedDataset(records, tokenizer, model.config.context_length)
          probe_generator = torch.Generator(device='cpu').manual_seed(SEED + 30)
          probe_indices = torch.randperm(len(dataset), generator=probe_generator)[:min(384, len(dataset))]
          observed = _loss_probe(model, dataset, probe_indices, 'cpu')
          target = float(os.environ['TARGET_PROBE'])
          result = {
              'format_version': '1.0',
              'python': platform.python_version(),
              'torch': torch.__version__,
              'kernel_mode': 'mkldnn-off',
              'aten_cpu_capability': '',
              'mkl_cbwr_mode': '${{ matrix.mkl_cbwr_mode }}',
              'mkl_cbwr': os.environ.get('MKL_CBWR', ''),
              'mkl_available': torch.backends.mkl.is_available(),
              'mkldnn_enabled': torch.backends.mkldnn.enabled,
              'probe_loss': observed,
              'target_probe_loss': target,
              'absolute_error': abs(observed - target),
              'exact_match': observed == target,
              'cash_compute_cost_usd': 0.0,
              'training_performed': False,
              'promotion_eligible': False,
          }
          Path('fingerprint.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: v2-mkldnn-off-mkl-${{ matrix.mkl_cbwr_mode }}
          path: fingerprint.json
          retention-days: 7

  aggregate:
    needs: probe
    if: always() && needs.probe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download all fingerprint records
        uses: actions/download-artifact@v4
        with:
          pattern: v2-mkldnn-off-mkl-*
          path: fingerprints
      - name: Build authoritative aggregate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          records = []
          for path in sorted(Path('fingerprints').glob('*/fingerprint.json')):
              records.append(json.loads(path.read_text(encoding='utf-8')))
          if len(records) != 4:
              raise SystemExit(f'expected 4 fingerprint records, found {len(records)}')
          records.sort(key=lambda item: item['mkl_cbwr_mode'])
          best = min(records, key=lambda item: (item['absolute_error'], item['mkl_cbwr_mode']))
          result = {
              'format_version': '1.1',
              'experiment': 'mkldnn-off-mkl-cbwr',
              'source_commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'target_probe_loss': records[0]['target_probe_loss'],
              'records': records,
              'best_mkl_cbwr_mode': best['mkl_cbwr_mode'],
              'best_absolute_error': best['absolute_error'],
              'exact_match_any': any(item['exact_match'] for item in records),
              'cash_compute_cost_usd': 0.0,
              'training_performed': False,
              'promotion_eligible': False,
          }
          out = Path('research/m6-v2-cpu-kernel-fingerprint/latest.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Persist authoritative fingerprint evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/m6-v2-cpu-kernel-fingerprint/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Research: persist v2 MKL fingerprint (#153)"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
