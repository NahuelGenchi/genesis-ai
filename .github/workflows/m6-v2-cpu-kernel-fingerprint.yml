name: M6 v2 paired Python runtime fingerprint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/m6-v2-cpu-kernel-fingerprint.yml

permissions:
  contents: write

concurrency:
  group: m6-v2-cpu-kernel-fingerprint
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        repeat: [1, 2, 3]
    env:
      WORK: runs/m6-v2-cpu-kernel-fingerprint
      TARGET_PROBE: "4.228255425977561"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up hosted CPython control
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Create paired Python runtimes on the same runner
        run: |
          echo "SETUP_PY=$(command -v python)" >> "$GITHUB_ENV"
          /usr/bin/python3 -m venv "$RUNNER_TEMP/v2-system-venv"
          echo "SYSTEM_PY=$RUNNER_TEMP/v2-system-venv/bin/python" >> "$GITHUB_ENV"

      - name: Install identical pinned CPU PyTorch in both runtimes
        run: |
          "$SETUP_PY" -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.11.0"
          "$SYSTEM_PY" -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.11.0"
          "$SETUP_PY" - <<'PY'
          import platform, torch
          print({"runtime": "setup", "python": platform.python_version(), "torch": torch.__version__})
          PY
          "$SYSTEM_PY" - <<'PY'
          import platform, torch
          print({"runtime": "system", "python": platform.python_version(), "torch": torch.__version__})
          PY

      - name: Rebuild one frozen input set shared by both runtimes
        run: |
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cp data/bootstrap-tokenizer-lock.json "$WORK/bootstrap-tokenizer-lock.json"
          PYTHONPATH=src "$SETUP_PY" -m genesis_ai.bootstrap_corpus \
            --catalog data/bootstrap-tokenizer-sources.json \
            --workspace "$WORK/public-corpus" \
            --output "$WORK/rebuilt-tokenizer.json" \
            --lock "$WORK/bootstrap-tokenizer-lock.json" \
            --vocab-size 512
          cmp tokenizers/genesis-v0.json "$WORK/rebuilt-tokenizer.json"
          PYTHONPATH=src "$SETUP_PY" -m genesis_ai.multidomain_curriculum_v2 \
            --suite evals/m6-domain-selection-v2.json \
            --tokenizer tokenizers/genesis-v0.json \
            --public-data "$WORK/public-corpus/filtered" \
            --records "$WORK/procedural.jsonl" \
            --output "$WORK/curriculum.json"

      - name: Write shared fingerprint probe
        run: |
          cat > "$RUNNER_TEMP/v2_fingerprint_probe.py" <<'PY'
          import importlib.util, json, os, platform, random, sys
          from pathlib import Path
          import torch
          from genesis_ai.multidomain_training_v2 import SEED, _loss_probe, validate_inputs
          from genesis_ai.terminated_training import TerminatedGenerationAlignedDataset

          runtime, repeat, output = sys.argv[1], int(sys.argv[2]), Path(sys.argv[3])
          cpu = {}
          cpuinfo = Path('/proc/cpuinfo')
          if cpuinfo.exists():
              first = cpuinfo.read_text(encoding='utf-8', errors='replace').split('\n\n', 1)[0]
              for line in first.splitlines():
                  if ':' not in line:
                      continue
                  key, value = (part.strip() for part in line.split(':', 1))
                  if key in {'vendor_id', 'cpu family', 'model', 'model name', 'stepping', 'microcode'}:
                      cpu[key] = value

          torch.backends.mkldnn.enabled = False
          torch.set_num_threads(1)
          torch.use_deterministic_algorithms(True)
          random.seed(SEED)
          torch.manual_seed(SEED)
          model, tokenizer, records, _, _, _ = validate_inputs(
              parent_checkpoint='checkpoints/genesis-micro-2m-v1.pt',
              curriculum_lock='runs/m6-v2-cpu-kernel-fingerprint/curriculum.json',
              records_path='runs/m6-v2-cpu-kernel-fingerprint/procedural.jsonl',
              public_data='runs/m6-v2-cpu-kernel-fingerprint/public-corpus/filtered',
              tokenizer_path='tokenizers/genesis-v0.json',
          )
          dataset = TerminatedGenerationAlignedDataset(records, tokenizer, model.config.context_length)
          probe_generator = torch.Generator(device='cpu').manual_seed(SEED + 30)
          probe_indices = torch.randperm(len(dataset), generator=probe_generator)[:min(384, len(dataset))]
          observed = _loss_probe(model, dataset, probe_indices, 'cpu')
          target = float(os.environ['TARGET_PROBE'])
          result = {
              'format_version': '1.0',
              'runtime': runtime,
              'repeat': repeat,
              'python': platform.python_version(),
              'python_compiler': platform.python_compiler(),
              'python_executable': sys.executable,
              'libc': list(platform.libc_ver()),
              'numpy_available': importlib.util.find_spec('numpy') is not None,
              'torch': torch.__version__,
              'kernel_mode': 'mkldnn-off',
              'aten_cpu_capability': '',
              'mkl_cbwr': os.environ.get('MKL_CBWR', ''),
              'mkl_available': torch.backends.mkl.is_available(),
              'mkldnn_enabled': torch.backends.mkldnn.enabled,
              'cpu': cpu,
              'machine': platform.machine(),
              'runner_arch': os.environ.get('RUNNER_ARCH', ''),
              'image_os': os.environ.get('ImageOS', ''),
              'image_version': os.environ.get('ImageVersion', ''),
              'probe_loss': observed,
              'target_probe_loss': target,
              'absolute_error': abs(observed - target),
              'exact_match': observed == target,
              'cash_compute_cost_usd': 0.0,
              'training_performed': False,
              'promotion_eligible': False,
          }
          output.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Measure both runtimes on this exact runner CPU
        run: |
          PYTHONPATH=src "$SETUP_PY" "$RUNNER_TEMP/v2_fingerprint_probe.py" setup "${{ matrix.repeat }}" fingerprint-setup.json
          PYTHONPATH=src "$SYSTEM_PY" "$RUNNER_TEMP/v2_fingerprint_probe.py" system "${{ matrix.repeat }}" fingerprint-system.json

      - uses: actions/upload-artifact@v4
        with:
          name: v2-python-paired-${{ matrix.repeat }}
          path: fingerprint-*.json
          retention-days: 7

  aggregate:
    needs: probe
    if: always() && needs.probe.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download all paired fingerprint records
        uses: actions/download-artifact@v4
        with:
          pattern: v2-python-paired-*
          path: fingerprints
      - name: Build authoritative paired aggregate
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          records = []
          for path in sorted(Path('fingerprints').glob('**/fingerprint-*.json')):
              records.append(json.loads(path.read_text(encoding='utf-8')))
          if len(records) != 6:
              raise SystemExit(f'expected 6 fingerprint records, found {len(records)}')
          records.sort(key=lambda item: (item['repeat'], item['runtime']))
          best = min(records, key=lambda item: (item['absolute_error'], item['repeat'], item['runtime']))
          pairs = []
          for repeat in (1, 2, 3):
              pair = {item['runtime']: item for item in records if item['repeat'] == repeat}
              if set(pair) != {'setup', 'system'}:
                  raise SystemExit(f'incomplete runtime pair for repeat {repeat}')
              setup_cpu = pair['setup'].get('cpu', {}).get('model name', '')
              system_cpu = pair['system'].get('cpu', {}).get('model name', '')
              if setup_cpu != system_cpu:
                  raise SystemExit(f'paired runtimes did not share CPU for repeat {repeat}: {setup_cpu!r} != {system_cpu!r}')
              pairs.append({
                  'repeat': repeat,
                  'cpu_model': setup_cpu,
                  'setup_python': pair['setup']['python'],
                  'system_python': pair['system']['python'],
                  'setup_probe_loss': pair['setup']['probe_loss'],
                  'system_probe_loss': pair['system']['probe_loss'],
                  'system_minus_setup': pair['system']['probe_loss'] - pair['setup']['probe_loss'],
                  'same_probe_loss': pair['system']['probe_loss'] == pair['setup']['probe_loss'],
              })
          result = {
              'format_version': '1.4',
              'experiment': 'mkldnn-off-python-runtime-paired-same-cpu',
              'source_commit': os.environ['GITHUB_SHA'],
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'target_probe_loss': records[0]['target_probe_loss'],
              'records': records,
              'pairs': pairs,
              'best_runtime': best['runtime'],
              'best_repeat': best['repeat'],
              'best_absolute_error': best['absolute_error'],
              'unique_probe_losses': sorted({item['probe_loss'] for item in records}),
              'cpu_models': sorted({item.get('cpu', {}).get('model name', '') for item in records}),
              'python_versions': sorted({item['python'] for item in records}),
              'exact_match_any': any(item['exact_match'] for item in records),
              'cash_compute_cost_usd': 0.0,
              'training_performed': False,
              'promotion_eligible': False,
          }
          out = Path('research/m6-v2-cpu-kernel-fingerprint/latest.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8', newline='\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
      - name: Persist authoritative fingerprint evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/m6-v2-cpu-kernel-fingerprint/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Research: persist paired Python runtime fingerprint (#153)"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
