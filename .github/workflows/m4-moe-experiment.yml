name: M4 sparse MoE experiment

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m4-moe-experiment
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare persistent Python environment
        run: |
          ENV_DIR="$HOME/.cache/genesis-ai-ci/venv"
          if [ ! -x "$ENV_DIR/bin/python" ]; then python3 -m venv "$ENV_DIR"; fi
          if ! "$ENV_DIR/bin/python" -c 'import torch' >/dev/null 2>&1; then
            "$ENV_DIR/bin/python" -m pip install --upgrade pip
            "$ENV_DIR/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          fi
      - name: Rebuild approved corpus
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          rm -rf runs/m4-moe
          PYTHONPATH=src "$PY" -m genesis_ai.bootstrap_corpus \
            --catalog data/bootstrap-tokenizer-sources.json \
            --workspace runs/m4-moe/corpus \
            --output runs/m4-moe/rebuilt-tokenizer.json \
            --lock data/bootstrap-tokenizer-lock.json \
            --vocab-size 512
          cmp tokenizers/genesis-v0.json runs/m4-moe/rebuilt-tokenizer.json
      - name: Run fixed-active-compute experiment
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          PYTHONPATH=src "$PY" -m genesis_ai.research \
            --definition experiments/m4-moe-v1.json \
            --data runs/m4-moe/corpus/filtered \
            --tokenizer tokenizers/genesis-v0.json \
            --output research/m4-moe-v1.json \
            --device cpu
          PYTHONPATH=src "$PY" -m genesis_ai.result_provenance \
            research/m4-moe-v1.json \
            --source-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID"
      - name: Require non-collapsed routing
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          "$PY" - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('research/m4-moe-v1.json').read_text())
          for candidate in result['results']:
              if candidate['config'].get('ffn_type') != 'moe':
                  continue
              for layer in candidate.get('routing', []):
                  assert layer['utilization'] == 1.0, layer
                  assert layer['max_fraction'] < 0.75, layer
          PY
      - name: Validate repository
        run: PYTHON_BIN="$HOME/.cache/genesis-ai-ci/venv/bin/python" ./scripts/test_local.sh
      - name: Commit experiment result safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/m4-moe-v1.json
          if ! git diff --cached --quiet; then
            git commit -m "M4: record sparse MoE experiment (#29)"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
