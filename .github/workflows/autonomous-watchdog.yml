name: Autonomous continuity watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/autonomous-watchdog.yml"
      - ".github/workflows/autonomous-continuation.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: autonomous-continuity-watchdog
  cancel-in-progress: true

jobs:
  ensure-continuity:
    if: github.event.repository.private == false
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Restart autonomous chain only when idle
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          url = f"https://api.github.com/repos/{repo}/actions/workflows/autonomous-improvement.yml/runs?per_page=20"
          request = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(request) as response:
              runs = json.load(response)["workflow_runs"]
          active = [run for run in runs if run["status"] in {"queued", "in_progress", "waiting", "pending", "requested"}]
          if active:
              print(f"autonomous chain healthy: {len(active)} active/pending run(s)")
              raise SystemExit(0)

          dispatch = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/workflows/autonomous-improvement.yml/dispatches",
              data=json.dumps({"ref": "main"}).encode("utf-8"),
              headers={**headers, "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(dispatch) as response:
              if response.status != 204:
                  raise RuntimeError(f"unexpected dispatch status: {response.status}")
          print("autonomous chain was idle; dispatched a recovery cycle")
          PY
