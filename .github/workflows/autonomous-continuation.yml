name: Autonomous cycle continuation

on:
  workflow_run:
    workflows: ["Autonomous verified improvement"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: autonomous-cycle-continuation
  cancel-in-progress: false

jobs:
  continue:
    if: github.event.repository.private == false && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Dispatch the next canonical cycle
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/workflows/autonomous-improvement.yml/dispatches",
              data=json.dumps({"ref": "main"}).encode("utf-8"),
              headers=headers,
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 204:
                  raise RuntimeError(f"unexpected dispatch status: {response.status}")
          print("dispatched next autonomous improvement cycle")
          PY
