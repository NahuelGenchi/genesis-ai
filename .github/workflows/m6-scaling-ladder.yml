name: M6 scaling ladder benchmark — frozen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-record:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen ladder record
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('research/m6-scaling-ladder-v1.json').read_text())
          assert result['experiment'] == 'm6-scaling-ladder-v1'
          assert result['cash_compute_cost_usd'] == 0.0
          assert result['next_stage'] == 'micro-2m'
          assert [stage['parameter_count'] for stage in result['stages']] == [
              394560,
              1895808,
              4889088,
              10872576,
              25510912,
          ]
          assert all(stage['local_cpu_feasible'] for stage in result['stages'])
          assert result['result_provenance']['workflow_run_id'] == '31810045132'
          print('m6 scaling ladder v1 record verified')
          PY
