name: M6 scaling ladder benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - experiments/m6-scaling-ladder-v1.json
      - src/genesis_ai/scaling.py
      - tests/test_scaling.py
      - .github/workflows/m6-scaling-ladder.yml

permissions:
  contents: write

concurrency:
  group: m6-scaling-ladder-v1
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Prepare persistent Python environment
        run: |
          ENV_DIR="$HOME/.cache/genesis-ai-ci/venv"
          if [ ! -x "$ENV_DIR/bin/python" ]; then python3 -m venv "$ENV_DIR"; fi
          if ! "$ENV_DIR/bin/python" -c 'import torch' >/dev/null 2>&1; then
            "$ENV_DIR/bin/python" -m pip install --upgrade pip
            "$ENV_DIR/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          fi

      - name: Benchmark scaling ladder
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          PYTHONPATH=src "$PY" -m genesis_ai.scaling \
            --definition experiments/m6-scaling-ladder-v1.json \
            --tokenizer tokenizers/genesis-v0.json \
            --output research/m6-scaling-ladder-v1.json
          PYTHONPATH=src "$PY" -m genesis_ai.result_provenance \
            research/m6-scaling-ladder-v1.json \
            --source-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID"

      - name: Require sequential next stage
        run: |
          PY="$HOME/.cache/genesis-ai-ci/venv/bin/python"
          "$PY" - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('research/m6-scaling-ladder-v1.json').read_text())
          assert result['cash_compute_cost_usd'] == 0.0, result
          assert result['stages'][0]['name'] == 'baseline-0.4m', result
          feasible_candidates = [s for s in result['stages'] if s['role'] == 'candidate' and s['local_cpu_feasible']]
          expected = feasible_candidates[0]['name'] if feasible_candidates else None
          assert result['next_stage'] == expected, result
          PY

      - name: Validate repository
        run: PYTHON_BIN="$HOME/.cache/genesis-ai-ci/venv/bin/python" ./scripts/test_local.sh

      - name: Commit measured ladder safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/m6-scaling-ladder-v1.json
          if ! git diff --cached --quiet; then
            git commit -m "M6: record scaling ladder benchmark (#35)"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
