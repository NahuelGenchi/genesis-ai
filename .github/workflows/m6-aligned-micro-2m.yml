name: M6 aligned micro-2m v1 record verifier

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Verify frozen rejected experiment
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('research/m6-aligned-micro-2m-v1')
          training = json.loads((root / 'training.json').read_text())
          repro = json.loads((root / 'reproduction.json').read_text())
          domain = json.loads((root / 'candidate-domain.json').read_text())
          alignment = json.loads((root / 'candidate-alignment.json').read_text())
          baseline_m3 = json.loads((root / 'baseline-m3.json').read_text())
          candidate_m3 = json.loads((root / 'candidate-m3.json').read_text())
          gate = json.loads((root / 'gate.json').read_text())

          candidate_sha = 'eb34bdbfcd518c17918135bdfc80f9594e22fcf6f3460676b016efdb3194f359'

          assert training['training_policy'] == 'm6-micro-2m-aligned-training-v1', training
          assert training['dataset_version'] == 'generation-aligned-response-v1', training
          assert training['inference_checkpoint_sha256'] == candidate_sha, training
          assert training['parameter_count'] == 1_895_808, training
          assert training['steps'] == 1_955, training
          assert training['processed_tokens'] == 2_001_920, training
          assert training['target_training_tokens'] == 2_000_000, training
          assert training['procedural_step_fraction'] == 0.8, training
          assert training['public_step_fraction'] == 0.2, training
          assert training['cash_compute_cost_usd'] == 0.0, training
          assert training['alignment']['first_response_target_coverage'] == 1.0, training
          assert training['alignment']['first_response_target_updates'] == 4_096, training
          assert training['alignment']['continuation_target_updates'] == 8_416, training
          assert training['alignment']['schedule_target_updates'] == 12_512, training
          assert training['alignment']['schedule_unique_updates'] == 12_512, training
          assert training['alignment']['schedule_sha256'] == '2dc7f266f959401fbd8b0961d588d98a5ec6522522e6b88a2407e2eb2609ed12', training
          assert training['aligned_probe_loss_before'] == 6.335199164226651, training
          assert training['aligned_probe_loss_after'] == 0.003966466134443181, training

          assert repro['primary_checkpoint_sha256'] == candidate_sha, repro
          assert repro['weights_equal'] is True, repro
          assert repro['config_equal'] is True, repro
          assert repro['tokenizer_equal'] is True, repro
          assert repro['step_equal'] is True, repro
          assert repro['metadata_equal'] is True, repro
          assert repro['reproducible'] is True, repro

          code = domain['domains']['code']
          assert domain['suite_version'] == 'm6-domain-selection-v1', domain
          assert domain['suite_sha256'] == '3ff62c0241003198c786afb29c4d64394566ce82dba7eef7681fc9ebe25655d9', domain
          assert domain['checkpoint_sha256'] == candidate_sha, domain
          assert code['task_count'] == 60, code
          assert code['exact_correct'] == 0, code
          assert code['exact_accuracy'] == 0.0, code
          assert code['task_set_sha256'] == 'edea452777c7328fd13d550ced322bd5815eac664be5f3924047f15122cc17c8', code

          rolling = alignment['generation_aligned_rolling']
          assert alignment['checkpoint_sha256'] == candidate_sha, alignment
          assert alignment['task_set_sha256'] == code['task_set_sha256'], alignment
          assert rolling['target_tokens'] == 891, rolling
          assert rolling['greedy_correct_tokens'] == 891, rolling
          assert rolling['greedy_token_accuracy'] == 1.0, rolling
          assert rolling['first_token_greedy_correct_tasks'] == 60, rolling
          assert rolling['first_token_greedy_correct_rate'] == 1.0, rolling
          assert rolling['all_greedy_tokens_correct_tasks'] == 60, rolling
          assert rolling['all_greedy_tokens_correct_rate'] == 1.0, rolling
          assert rolling['mean_loss'] == 0.004457061989136865, rolling

          assert baseline_m3['primary_metric']['value'] == 3.686832940578461, baseline_m3
          assert candidate_m3['primary_metric']['value'] == 3.348287069797516, candidate_m3
          assert candidate_m3['checkpoint_sha256'] == candidate_sha, candidate_m3
          assert candidate_m3['contamination']['blocking'] is False, candidate_m3
          assert candidate_m3['contamination']['exact_overlap_count'] == 0, candidate_m3

          assert gate['candidate_checkpoint_sha256'] == candidate_sha, gate
          assert gate['gate_version'] == 'm6-aligned-scale-promotion-v1', gate
          assert gate['decision'] == 'reject', gate
          assert gate['promoted'] is False, gate
          assert gate['decision_sha256'] == '5c646521e7ee4fe6bbbe024e1f85f6478d6eb0397b1e2f2981e6c5cb835b9195', gate
          assert gate['result_provenance'] == {
              'source_commit': 'ae9d62ded8654899c1614c725d18b99227f3b734',
              'workflow_run_id': '31839556203',
          }, gate
          assert [item['name'] for item in gate['gates'] if not item['passed']] == ['code_exact_accuracy'], gate

          assert not Path('checkpoints/genesis-micro-2m-v1.pt').exists()
          assert not Path('models/genesis-micro-2m-v1/MODEL_CARD.md').exists()
          assert not Path('models/genesis-micro-2m-v1/metrics.json').exists()
          PY
