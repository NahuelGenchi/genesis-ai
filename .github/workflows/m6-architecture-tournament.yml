name: M6 architecture tournament v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/genesis_ai/architecture_tournament.py
      - tests/test_architecture_tournament.py
      - experiments/m6-architecture-tournament-v1.json
      - .github/workflows/m6-architecture-tournament.yml

permissions:
  contents: write

concurrency:
  group: m6-architecture-tournament-v1
  cancel-in-progress: false

jobs:
  tournament:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      WORK: runs/m6-architecture-tournament-v1-${{ github.run_id }}
      RESULT: research/m6-architecture-tournament-v1.json
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enforce free public runner and install CPU PyTorch
        run: |
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$RUNNER_OS" = "Linux"
          python -m pip install --disable-pip-version-check --no-input --index-url https://download.pytorch.org/whl/cpu torch

      - name: Rebuild frozen public corpus
        run: |
          rm -rf "$WORK"
          mkdir -p "$WORK" "$(dirname "$RESULT")"
          cp data/bootstrap-tokenizer-lock.json "$WORK/bootstrap-tokenizer-lock.json"
          python -m genesis_ai.bootstrap_corpus \
            --catalog data/bootstrap-tokenizer-sources.json \
            --workspace "$WORK/public-corpus" \
            --output "$WORK/rebuilt-tokenizer.json" \
            --lock "$WORK/bootstrap-tokenizer-lock.json" \
            --vocab-size 512
          cmp data/bootstrap-tokenizer-lock.json "$WORK/bootstrap-tokenizer-lock.json"
          cmp tokenizers/genesis-v0.json "$WORK/rebuilt-tokenizer.json"

      - name: Run fixed-FLOP architecture tournament
        run: |
          python -m genesis_ai.architecture_tournament \
            --definition experiments/m6-architecture-tournament-v1.json \
            --public-data "$WORK/public-corpus/filtered" \
            --tokenizer tokenizers/genesis-v0.json \
            --output "$RESULT" \
            --device cpu
          python -m genesis_ai.result_provenance \
            "$RESULT" \
            --source-commit "$(git rev-parse HEAD)" \
            --workflow-run-id "$GITHUB_RUN_ID"

      - name: Validate repository
        run: PYTHON_BIN=python ./scripts/test_local.sh

      - name: Commit immutable tournament result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT"
          if ! git diff --cached --quiet; then
            git commit -m "Research: record architecture tournament (#148, #203)"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
