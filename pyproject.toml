[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-ai"
version = "0.0.1"
description = "From-scratch zero-budget AI research project"
requires-python = ">=3.11"
dependencies = ["torch>=2.0"]

[project.scripts]
genesis-train = "genesis_ai.train:main"
genesis-generate = "genesis_ai.generate:main"
genesis-eval = "genesis_ai.evaluate:main"
genesis-ingest = "genesis_ai.ingest:main"
genesis-filter = "genesis_ai.filtering:main"
genesis-tokenizer-train = "genesis_ai.tokenizer:main"
genesis-eval-lab = "genesis_ai.eval_lab:main"
genesis-benchmark = "genesis_ai.benchmark:main"
genesis-research = "genesis_ai.research:main"
genesis-challenge = "genesis_ai.challenger:main"
genesis-experience = "genesis_ai.experience:main"
genesis-candidate = "genesis_ai.candidate:main"
genesis-promote = "genesis_ai.promotion:main"
genesis-cycle-record = "genesis_ai.cycle:main"
genesis-scale = "genesis_ai.scaling:main"
genesis-domain-select = "genesis_ai.domain_selection:main"
genesis-curriculum = "genesis_ai.curriculum:main"
genesis-scale-train = "genesis_ai.scale_training:main"
genesis-scale-repro = "genesis_ai.scale_repro:main"
genesis-scale-gate = "genesis_ai.scale_gate:main"
genesis-scale-model-card = "genesis_ai.scale_model_card:main"
genesis-aligned-train = "genesis_ai.aligned_training:main"
genesis-aligned-gate = "genesis_ai.aligned_gate:main"
genesis-aligned-model-card = "genesis_ai.aligned_model_card:main"
genesis-terminated-eval = "genesis_ai.terminated_eval:main"
genesis-terminated-train = "genesis_ai.terminated_training:main"
genesis-terminated-gate = "genesis_ai.terminated_gate:main"
genesis-terminated-model-card = "genesis_ai.terminated_model_card:main"
genesis-accelerator = "genesis_ai.accelerator_job:main"

[tool.setuptools.packages.find]
where = ["src"]
