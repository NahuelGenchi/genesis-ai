[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-ai"
version = "0.0.1"
description = "From-scratch zero-budget AI research project"
requires-python = ">=3.11"
dependencies = ["torch>=2.0"]

[project.scripts]
genesis-train = "genesis_ai.train:main"
genesis-generate = "genesis_ai.generate:main"
genesis-eval = "genesis_ai.evaluate:main"
genesis-ingest = "genesis_ai.ingest:main"
genesis-filter = "genesis_ai.filtering:main"
genesis-tokenizer-train = "genesis_ai.tokenizer:main"
genesis-eval-lab = "genesis_ai.eval_lab:main"
genesis-benchmark = "genesis_ai.benchmark:main"
genesis-research = "genesis_ai.research:main"
genesis-challenge = "genesis_ai.challenger:main"
genesis-experience = "genesis_ai.experience:main"
genesis-candidate = "genesis_ai.candidate:main"
genesis-promote = "genesis_ai.promotion:main"
genesis-cycle-record = "genesis_ai.cycle:main"

[tool.setuptools.packages.find]
where = ["src"]
